<title>Página no encontrada — Cadencia / Decadencia</title>
<meta name="robots" content="noindex">
<script>
// A route link whose share page is not published yet (rutas/<id>/) still opens the route on the site.
(function () {
  var m = location.pathname.match(/^\/rutas\/([^/]+)\/?$/);
  location.replace('/' + (m ? '#ruta/' + m[1] : ''));
})();
</script>
